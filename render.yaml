services:
  - type: web
    name: cognivault-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: cognivault
      - key: CORS_ORIGINS
        value: https://cognivault-ebon.vercel.app,https://cognivault-app.vercel.app,http://localhost:5173
      - key: MODEL_PATH
        value: models/logistic_regression_model.joblib
